name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for leaked secrets
        run: |
          docker run --rm -v "$PWD":/repo --entrypoint sh zricethezav/gitleaks:latest \
            -c "git config --global --add safe.directory /repo && gitleaks git /repo --redact -v"

  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create CI env file with throwaway secrets
        run: |
          cat > .env <<EOF
          SECRET_KEY=$(openssl rand -hex 32)
          DEBUG=False
          ALLOWED_HOSTS=localhost,127.0.0.1
          DB_NAME=swiggy
          DB_USER=swiggy
          DB_PASSWORD=$(openssl rand -hex 16)
          DB_PORT=5432
          EOF

      - name: Build images
        run: docker compose build

      - name: Scan images with Trivy (report only for now)
        run: |
          for img in swiggy-backend:local swiggy-frontend:local; do
            echo "=== Scanning $img ==="
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image \
              --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 "$img"
          done

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for backend to be healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q backend)")
            echo "backend: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 5
          done
          exit 1

      - name: Smoke tests
        run: |
          curl -fsS http://localhost:3000/api/restaurants/ | grep -q "Meghana"
          curl -fsS http://localhost:3000/ | grep -q 'id="root"'
          curl -sI http://localhost:3000/static/admin/css/base.css | grep -qi "text/css"

      - name: Log in to GHCR (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag and push tested images (main branch only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for svc in backend frontend; do
            docker tag swiggy-$svc:local ghcr.io/$OWNER/swiggy-$svc:${{ github.sha }}
            docker push ghcr.io/$OWNER/swiggy-$svc:${{ github.sha }}
          done

      - name: Show logs if something failed
        if: failure()
        run: docker compose logs

      - name: Clean up
        if: always()
        run: docker compose down -v
